<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Mood Meals App</title>
  <link rel="stylesheet" href="./style.css">
</head>
<body>

  <div id="login-page" class="page">
    <h2>Login</h2>
    <input type="text" id="username" placeholder="Username" >
    <input type="password" id="password" placeholder="Password" >
    <button onclick="login()">Login</button>
    <p id="login-error"></p>
  </div>

  <div id="mood-page" class="page hidden">
    <h2>How are you feeling today?</h2>
    <button onclick="selectMood('happy')">Happy</button>
    <button onclick="selectMood('sad')">Sad</button>
    <button onclick="selectMood('tired')">Tired</button>
    <button onclick="selectMood('stressed')">Stressed</button>
  </div>

  <div id="result-page" class="page hidden">
    <h2 id="mood-text"></h2>
    <p id="suggestion-text"></p>
    <button onclick="goToMoodPage()">Back</button>
    <button onclick="showHistory()">Show History</button>
  </div>

  <div id="history-page" class="page hidden">
    <h2>Mood History</h2>
    <ul id="history-list"></ul>
    <button onclick="goToMoodPage()">Back</button>
  </div>

  <script src="./script.js"></script>
</body>
</html>

  <script>
    const cards = document.querySelectorAll('.cert-card');

    function getDirection(e, card) {
      const rect = card.getBoundingClientRect();
      const x = e.clientX - rect.left - rect.width / 2;
      const y = e.clientY - rect.top - rect.height / 2;
      const angle = Math.atan2(y, x) * (180 / Math.PI);
      
      if (angle >= -45 && angle <= 45) return 'right';
      if (angle > 45 && angle < 135) return 'bottom';
      if (angle >= 135 || angle <= -135) return 'left';
      return 'top';
    }

    cards.forEach(card => {
      const details = card.querySelector('.cert-details');

      card.addEventListener('mouseenter', e => {
        const direction = getDirection(e, card);
        details.classList.remove('from-left', 'from-right', 'from-top', 'from-bottom', 'in-view');
        details.classList.add(`from-${direction}`);

        // Trigger reflow before adding in-view
        void details.offsetWidth;
        details.classList.add('in-view');
      });

      card.addEventListener('mouseleave', () => {
        details.classList.remove('in-view');
      });
    });
     function toggleMenu() {
        document.getElementById("sidebar").classList.toggle("show");
      }
  </script>

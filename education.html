<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Bala Yaswanth | Certifications</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css"/>
  <link rel="stylesheet" href="education.css">
</head>
<body>

  <!-- Toggle Button for Mobile -->
  <button class="nav-toggle" onclick="toggleMenu()">☰</button>

  <!-- Sidebar Navigation -->
  <nav id="sidebar">
    
    <ul>
    <div class="sidebar">
          <div class="icon">
            <aside class="display_icon">Home</aside>
            <a href="index.html" class="display_anchor"
              ><i class="fas fa-home"></i
            ></a>
          </div>
          <div class="icon">
            <aside class="display_icon">About</aside>

            <a href="about.html" class="display_anchor "> <i class="fas fa-user"></i></a>
          </div>
          <div class="icon">
            <aside class="display_icon">Portfolio</aside>

            <a href="project.html" class="display_anchor"><i class="fas fa-briefcase"></i></a>
          </div>
          <div class="icon">
            <aside class="display_icon">Certification</aside>

            <a href="education.html"  class="display_anchor "
              ><i class="fas fa-cogs"></i
            ></a>
          </div>
          <div class="icon">
            <aside class="display_icon">Contact</aside>

            <a href="contact.html"  class="display_anchor"><i class="fas fa-envelope"></i></a>
          </div>
    </ul>
  </nav>

  <!-- Certifications Section -->
  <section class="certification-section">
    <h1>MY <span>CERTIFICATIONS</span></h1>
    <div class="certification-container">

      <div class="cert-card">
        <img src="Certificate1.jpg" alt="Certificate 1">
        <div class="cert-details">
          <p>Artificial Intelligence Fundamentals</p>
          <p><strong>Issued by:</strong> IBM</p>
          <p><strong>Year:</strong> 2025</p>
        </div>
      </div>

      <div class="cert-card">
        <img src="Certificate2.jpg" alt="Certificate 2">
        <div class="cert-details">
          <p>Customer Engagement: Problem Solving</p>
          <p><strong>Issued by:</strong> IBM</p>
          <p><strong>Year:</strong> 2025</p>
        </div>
      </div>

      <div class="cert-card">
        <img src="Certificate3.jpg" alt="Certificate 3">
        <div class="cert-details">
          <p>Communication & Personality Dynamics</p>
          <p><strong>Issued by:</strong> IBM</p>
          <p><strong>Year:</strong> 2025</p>
        </div>
      </div>

    </div>
  </section>

  <script>
    // Direction-based animation
    const cards = document.querySelectorAll('.cert-card');

    function getDirection(e, card) {
      const rect = card.getBoundingClientRect();
      const x = e.clientX - rect.left - rect.width / 2;
      const y = e.clientY - rect.top - rect.height / 2;
      const angle = Math.atan2(y, x) * (180 / Math.PI);
      if (angle >= -45 && angle <= 45) return 'right';
      if (angle > 45 && angle < 135) return 'bottom';
      if (angle >= 135 || angle <= -135) return 'left';
      return 'top';
    }

    cards.forEach(card => {
      const details = card.querySelector('.cert-details');

      card.addEventListener('mouseenter', e => {
        const direction = getDirection(e, card);
        details.classList.remove('from-left', 'from-right', 'from-top', 'from-bottom', 'in-view');
        details.classList.add(`from-${direction}`);
        void details.offsetWidth; // trigger reflow
        details.classList.add('in-view');
      });

      card.addEventListener('mouseleave', () => {
        details.classList.remove('in-view');
      });
    });

    // Sidebar toggle
    function toggleMenu() {
      document.getElementById("sidebar").classList.toggle("show");
    }
  </script>

</body>
</html>

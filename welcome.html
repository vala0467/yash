<!DOCTYPE html>
<html lang="en">
<head>
    <!-- Meta tags for character encoding and responsiveness -->
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <!-- Title of the webpage -->
    <title>Login Success</title>

    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

    <!-- Bootstrap JavaScript Bundle -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

    <!-- Custom CSS styles -->
    <style>
        body {
            margin: 0;
            padding: 0;
            background-color: azure;
        }

        /* Main body with background image */
        .main-body {
            display: flex;
            flex-direction: column; /* Stack heading and button vertically */
            justify-content: center;
            align-items: center;
            height: 100vh;
            background-image: url('https://thumbs.dreamstime.com/b/cricket-ball-helmet-grass-under-flashlights-outdoor-stadium-upcoming-match-banner-concept-sport-tournament-321650371.jpg');
            background-size: cover;
            background-position: center;
        }

        /* Heading style */
        .heading {
            color: white;
            font-size: 50px;
            font-weight: bold;
            margin-bottom: 30px; /* Space between heading and button */
            text-shadow: 2px 2px 5px black; /* Glow for better readability */
        }

        /* Custom button style */
        .play-btn {
            font-size: 24px; /* Bigger text */
            padding: 15px 40px; /* Bigger button */
            border-radius: 12px; /* Rounded edges */
        }
    </style>
</head>
<body>

    <!-- Navigation bar -->
    <nav class="navbar navbar-expand-lg bg-body-tertiary">
        <div class="container-md">
            <!-- You can add nav items here if needed -->
        </div>
    </nav>

    <!-- Main content section -->
    <div class="main-body">
        <h1 class="heading">Welcome To HandCricket Game</h1>
        
        <!-- Big Let's Play Button -->
        <a href="./cricket.html" class="btn btn-primary btn-lg play-btn">Let's Play</a>
    </div>

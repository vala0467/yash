<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Birthday Countdown Timer</title>
  <style>
    body {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      height: 100vh;
      font-family: Arial, sans-serif;
    /*  background: #e1f5fe;*/
    background-image: url( "https://images.unsplash.com/photo-1492684223066-81342ee5ff30?q=80&w=1170&auto=format&fit=crop&ixlib=rb-4.1.0&ixid=M3wxMjA3fDB8MHxwaG90by1wYWdlfHx8fGVufDB8fHx8fA%3D%3D ");
    background-repeat: no-repeat;
    background-size: cover;
    background-position: center;
}
    
    button {
      padding: 12px 20px;
      border: none;
      background-color: #d4c308d3;
      color: white;
      border-radius: 6px;
      font-size: 16px;
      cursor: pointer;
      margin-bottom: 20px;
    }
    #result {
      font-size: 20px;
      color: #f60d0d;
      text-align: center;
    }
  </style>
</head>
<body>

  <button id="checkBirthday">Start Birthday Countdown</button>
  <div id="result">Click the button to begin countdown.</div>

  <script src="./script.js">
     
  </script>

</body>
</html>

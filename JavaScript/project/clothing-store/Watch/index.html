<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Watch</title>
     <link rel="shortcut icon" href="./image.png" type="image/x-icon">
    <style>
        body {
            font-family: Arial, sans-serif;
            background: #f9f9f9;
            padding: 20px;
        }

        h2 {
            text-align: center;
            color: #333;
        }

        .product-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
            gap: 20px;
            padding: 20px 0;
        }

        .product-card {
            background-color: #fff;
            border: 1px solid #ddd;
            border-radius: 15px;
            padding: 15px;
            text-align: center;
            box-shadow: 0 4px 8px rgba(0, 0, 0, 0.1);
            transition: transform 0.3s ease;
        }

        .product-card:hover {
            transform: translateY(-5px);
        }

        .product-card img {
            width: 100%;
            height: 250px;
            object-fit: cover;
            border-radius: 12px;
            margin-bottom: 10px;
        }

        .product-name {
            font-size: 16px;
            font-weight: bold;
            margin-bottom: 8px;
        }

        .product-price {
            color: #f8300d;
            font-weight: bold;
            margin-bottom: 10px;
        }

        button {
            padding: 6px 10px;
            background-color: #3c17f5;
            border: none;
            color: white;
            border-radius: 8px;
            cursor: pointer;
            font-size: 14px;
            margin: 2px;
        }

        button:hover {
            background-color: #0ab0e2;
        }

        .cart-section {
            margin-top: 30px;
            padding: 15px;
            border: 2px dashed #ccc;
            border-radius: 10px;
            background-color: #fff;
        }

        .cart-item {
            border-bottom: 1px solid #ddd;
            padding: 8px 0;
        }

        .cart-total {
            font-weight: bold;
            margin-top: 10px;
            color: #444;
        }
                .button-right {
            text-align: right;
            margin-top: 10px;
        }
    </style>
</head>
<body>

<h2>Watch</h2>

<div class="product-grid" id="productGrid"></div>

<h2>Your Cart</h2>
<div class="cart-section" id="cartSection"></div>
<div class="button-right">
    <a href="file:///C:/Users/balay/OneDrive/bala%20yaswanth/Notes/JavaScript/project/clothing-store/index.html ">
        <button>Back</button>
    </a>
</div>

<script src="./script.js">
 
</script>
</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Dress Types </title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background: #f9f9f9;
            padding: 20px;
            text-align: center;
        }
        .gallery {
          width: 200px;
          height: 50px;
          border: 2px solid
          black;
          border-radius: 40px;
        }
        .gallery img {
            width: 100%;
            border-radius: 12px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.2);
            transition: transform 0.3s;
        }
        .gallery img:hover {
             
            .button{
                 width: 800px;
          height: 50px;
          border: 2px solid
          black;
          border-radius: 40px;
            }
        }
    </style>
</head>
<body>

<h2>Dress</h2>
<center>

<div class="gallery" id="dressGallery"></div>
<button onclick="increase()">+</button>
<button onclick="decrease()">-</button>
</center>

<script src="./script.js"></script>

</body>
</html>

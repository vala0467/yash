<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Bala Yaswanth</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css"/>
  <style>
    body {
      font-family: Arial, sans-serif;
      margin: 0;
      background: #f5f5f5;
    }

    .certification-section {
      text-align: center;
      padding: 50px 20px;
    }

    .certification-section h1 {
      font-size: 2.5rem;
      margin-bottom: 40px;
    }

    .certification-section h1 span {
      color: #007bff;
    }

    .certification-container {
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      gap: 30px;
    }

    .cert-card {
      position: relative;
      width: 250px;
      height: 250px;
      overflow: hidden;
      border-radius: 15px;
      box-shadow: 0 5px 15px rgba(0, 0, 0, 0.2);
      cursor: pointer;
      background: #fff;
    }

    .cert-card img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
    }

    .cert-details {
      position: absolute;
      width: 100%;
      height: 100%;
      background: rgba(0, 0, 0, 0.88);
      color: white;
      display: flex;
      flex-direction: column;
      justify-content: center;
      padding: 20px;
      box-sizing: border-box;
      text-align: left;
      transition: all 0.4s ease;
      pointer-events: none;
      opacity: 0;
    }

    /* Directional slide-ins */
    .from-left   .cert-details { transform: translateX(-100%); opacity: 1; }
    .from-right  .cert-details { transform: translateX(100%); opacity: 1; }
    .from-top    .cert-details { transform: translateY(-100%); opacity: 1; }
    .from-bottom .cert-details { transform: translateY(100%); opacity: 1; }

    .cert-card.hover .cert-details {
      transform: translateX(0) translateY(0);
      opacity: 1;
      pointer-events: auto;
    }

    /* Popup Styles */
    .popup {
      position: fixed;
      top: 0; left: 0;
      width: 100%; height: 100%;
      background: rgba(0, 0, 0, 0.8);
      display: none;
      align-items: center;
      justify-content: center;
      z-index: 1000;
      animation: fadeIn 0.4s ease-in;
    }

    .popup-content {
      background: white;
      padding: 30px;
      border-radius: 10px;
      width: 90%;
      max-width: 500px;
      text-align: left;
      position: relative;
      transform: translateY(30px);
      animation: slideUp 0.4s ease-out forwards;
    }

    .popup-content h2 {
      margin-top: 0;
    }

    .close-btn {
      position: absolute;
      top: 10px;
      right: 15px;
      background: none;
      border: none;
      font-size: 1.5rem;
      cursor: pointer;
    }

    @keyframes slideUp {
      from { transform: translateY(50px); opacity: 0; }
      to   { transform: translateY(0); opacity: 1; }
    }

    @keyframes fadeIn {
      from { opacity: 0; }
      to   { opacity: 1; }
    }
  </style>
</head>
<body>

  <section class="certification-section">
    <h1>MY <span>CERTIFICATIONS</span></h1>
    <div class="certification-container">

      <!-- Certificate 1 -->
      <div class="cert-card" data-title="Artificial Intelligence Fundamentals" data-issuer="IBM" data-year="2025">
        <img src="Certificate1.jpg" alt="Certificate 1">
        <div class="cert-details">
          <h2>Artificial Intelligence Fundamentals</h2>
          <p><strong>Issued by:</strong> IBM</p>
          <p><strong>Year:</strong> 2025</p>
        </div>
      </div>

      <!-- Certificate 2 -->
      <div class="cert-card" data-title="Problem Solving & Process Controls" data-issuer="IBM" data-year="2025">
        <img src="Certificate2.jpg" alt="Certificate 2">
        <div class="cert-details">
          <h2>Problem Solving & Process Controls</h2>
          <p><strong>Issued by:</strong> IBM</p>
          <p><strong>Year:</strong> 2025</p>
        </div>
      </div>

      <!-- Certificate 3 -->
      <div class="cert-card" data-title="Communication & Personality Dynamics" data-issuer="IBM" data-year="2025">
        <img src="Certificate3.jpg" alt="Certificate 3">
        <div class="cert-details">
          <h2>Communication & Personality Dynamics</h2>
          <p><strong>Issued by:</strong> IBM</p>
          <p><strong>Year:</strong> 2025</p>
        </div>
      </div>

    </div>
  </section>

  <!-- Popup -->
  <div class="popup" id="popup">
    <div class="popup-content">
      <button class="close-btn" onclick="closePopup()">&times;</button>
      <h2 id="popup-title"></h2>
      <p><strong>Issued by:</strong> <span id="popup-issuer"></span></p>
      <p><strong>Year:</strong> <span id="popup-year"></span></p>
    </div>
  </div>

  <script>
    const cards = document.querySelectorAll('.cert-card');
    const popup = document.getElementById('popup');
    const popupTitle = document.getElementById('popup-title');
    const popupIssuer = document.getElementById('popup-issuer');
    const popupYear = document.getElementById('popup-year');

    function getDirection(e, card) {
      const w = card.offsetWidth;
      const h = card.offsetHeight;
      const x = (e.pageX - card.getBoundingClientRect().left - w / 2) * (w > h ? h / w : 1);
      const y = (e.pageY - card.getBoundingClientRect().top - h / 2) * (h > w ? w / h : 1);
      const directionIndex = Math.round((Math.atan2(y, x) * (180 / Math.PI) + 180) / 90 + 3) % 4;
      return ['top', 'right', 'bottom', 'left'][directionIndex];
    }

    cards.forEach(card => {
      card.addEventListener('mouseenter', e => {
        const dir = getDirection(e, card);
        card.classList.remove('from-top', 'from-right', 'from-bottom', 'from-left', 'hover');
        card.classList.add(`from-${dir}`, 'hover');
      });

      card.addEventListener('mouseleave', () => {
        card.classList.remove('from-top', 'from-right', 'from-bottom', 'from-left', 'hover');
      });

      card.addEventListener('click', () => {
        popupTitle.textContent = card.dataset.title;
        popupIssuer.textContent = card.dataset.issuer;
        popupYear.textContent = card.dataset.year;
        popup.style.display = 'flex';
      });
    });

    function closePopup() {
      popup.style.display = 'none';
    }
  </script>
</body>
</html>

 <!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>Watch</title>
    <link rel="shortcut icon" href="./image.png" type="image/x-icon" />
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/css/bootstrap.min.css"
      rel="stylesheet"
      integrity="sha384-LN+7fdVzj6u52u30Kp6M/trliBMCMKTyK833zpbD+pXdCLuTusPj697FH4R/5mcr"
      crossorigin="anonymous"
    />
    <!--link rel="stylesheet" href="./bootstrap"-->
    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css"
    />
    <!--link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/css/bootstrap.min.css"-->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/js/bootstrap.bundle.min.js"></script>
    <style>
      body {
        font-family: Arial, sans-serif;
        background: #f9f9f9;
        padding: 20px;
      }
      @import url("https://fonts.googleapis.com/css2?family=Dancing+Script:wght@400..700&display=swap");
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
        transition: all 0.5s ease;
      }
      :root {
        --primary-color: rgb(237, 88, 113);
        --secondary-color: rgb(189, 189, 247);
        --ligh-pink: rgb(254, 225, 230);
      }
      header {
        background-color: var(--primary-color);
        color: white;
        font-size: 32px;
        font-family: "Dancing Script", cursive;
        padding: 10px 20px;

        position: fixed;
        top: 0;
        left: 0;
        width: 100%;
        z-index: 1000;

        display: flex;
        justify-content: flex-start;
        align-items: center;
        height: 60px;

        justify-content: space-between;
      }
      body {
        font-family: Arial, sans-serif;
        background: #f9f9f9;
        padding: 20px;
      }

      h2 {
        text-align: center;
        color: #333;
      }

      .product-grid {
        display: grid;
        grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
        gap: 20px;
        padding: 20px 0;
      }
      .product-card {
        position: relative; /* ✅ This is critical for the absolute heart icon */
        background-color: #fff;
        border: 1px solid #ddd;
        border-radius: 10px;
        padding: 15px;
        text-align: center;
        box-shadow: 0 4px 8px rgba(0, 0, 0, 0.1);
        transition: transform 0.3s ease;
      }
      .product-card:hover {
        transform: translateY(-5px);
      }

      .product-card img {
        width: 100%;
        height: 250px;
        object-fit: cover;
        border-radius: 12px;
        margin-bottom: 10px;
      }

      .product-name {
        font-size: 16px;
        font-weight: bold;
        margin-bottom: 8px;
      }

      .product-price {
        color: #f8300d;
        font-weight: bold;
        margin-bottom: 10px;
      }

      button {
        padding: 6px 10px;
        background-color: #3c17f5;
        border: none;
        color: white;
        border-radius: 8px;
        cursor: pointer;
        font-size: 14px;
        margin: 2px;
      }

      button:hover {
        background-color: #0ab0e2;
      }

      .cart-section {
        margin-top: 30px;
        padding: 15px;
        border: 2px dashed #ccc;
        border-radius: 10px;
        background-color: #fff;
      }

      .cart-item {
        border-bottom: 1px solid #ddd;
        padding: 8px 0;
      }

      .cart-total {
        font-weight: bold;
        margin-top: 10px;
        color: #444;
      }

      /* Right-align button */
      .button-right {
        text-align: right;
        margin-top: 10px;
      }
           .heart-icon {
        position: absolute;
        top: 10px;
        right: 10px;
        font-size: 1.6rem;
        color: rgb(11, 11, 11);
        z-index: 1;
        background-color: white;
        padding: 5px;
        border-radius: 50%;
        box-shadow: 0 2px 5px rgba(0, 0, 0, 0.2);
      }

    /* .heart-icon:hover {
      color: red;
    } */

    .bi-heart-fill {
      color: red !important;
    }
    </style>
    <script src="../homeScript.js"></script>
  </head>
  <body>
    <header>
      <div>
        <button
          class="bi bi-justify btn btn-light"
          data-bs-toggle="offcanvas"
          data-bs-target="#menu"
        >
          <span class="fs-5 fw-bold"> Yaswanth</span>
        </button>
      </div>
      <div class="ms-auto d-flex align-items-center gap-3">
        <span
          ><a class="text-decoration-none link-dark" href="../index.html"
            >Home</a
          ></span
        >

        <span
          ><a class="text-decoration-none link-dark" href="#">Product</a></span
        >
        <span
          ><a class="text-decoration-none link-dark" href="#">Wishlist</a></span
        >
      </div>
       <div class="cart-button position-relative">
  <button class="btn btn-warning bi bi-cart4 position-relative" data-bs-toggle="offcanvas" data-bs-target="#cartPanel">
    <span id="lblCount" class="badge bg-danger position-absolute rounded-circle">0</span>
 

    </header>
    <h2>Shoes</h2>

    <div class="product-grid" id="productGrid"></div>

    

    <script type="module" src="./script.js"></script>
  </body>
</html>
